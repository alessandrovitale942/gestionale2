<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RepairPro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0a;color:white;font-family:'DM Sans',sans-serif;margin:0;}
header{background:#111;padding:20px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Syne';font-size:22px;color:#ff5500;}
nav button{margin-right:10px;padding:8px 14px;border:none;background:#1a1a1a;color:white;border-radius:6px;cursor:pointer;}
nav button:hover{background:#ff5500;}
.container{padding:30px;}
.card{background:#141414;padding:20px;border-radius:10px;margin-bottom:20px;}
input,textarea,select{width:100%;padding:10px;background:#1e1e1e;border:none;color:white;border-radius:6px;margin-top:5px;}
button.primary{background:#ff5500;border:none;padding:10px 16px;border-radius:6px;color:white;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
td,th{padding:10px;border-bottom:1px solid #333;}
th{text-align:left;color:#aaa;font-size:12px;}
.stat{font-size:28px;font-weight:bold;}
.hidden{display:none;}
</style></head>
<body>
<header>
<div class="logo">RepairPro</div>
<nav><button onclick="show('dash')">Dashboard</button><button onclick="show('rip')">Riparazioni</button><button onclick="show('mag')">Magazzino</button><button onclick="show('fat')">Fatture</button><button onclick="backup()">Backup</button></nav>
</header>
<div class="container">
<!-- DASHBOARD -->
<div id="dash" class="page">
<div class="card">Totale riparazioni<div class="stat" id="statRip">0</div></div>
<div class="card">Incasso totale<div class="stat" id="statMoney">€0</div></div>
</div>
<!-- RIPARAZIONI -->
<div id="rip" class="page hidden">
<div class="card">
<h3>Nuova riparazione</h3>
<input id="nome" placeholder="Cliente"><input id="tel" placeholder="Telefono"><input id="device" placeholder="Dispositivo"><textarea id="problema" placeholder="Problema"></textarea>
<button class="primary" onclick="addRip()">Salva</button>
</div>
<div class="card">
<table>
<thead><tr><th>ID</th><th>Cliente</th><th>Dispositivo</th><th>Stato</th><th></th></tr></thead>
<tbody id="ripTable"></tbody>
</table>
</div>
</div>
<!-- MAGAZZINO -->
<div id="mag" class="page hidden">
<div class="card">
<h3>Aggiungi pezzo</h3>
<input id="pdesc" placeholder="Descrizione"><input id="pqty" type="number" placeholder="Quantità">
<button class="primary" onclick="addMag()">Salva</button>
</div>
<div class="card">
<table>
<thead><tr><th>Pezzo</th><th>Quantità</th><th></th></tr></thead>
<tbody id="magTable"></tbody>
</table>
</div>
</div>
<!-- FATTURE -->
<div id="fat" class="page hidden">
<div class="card">
<h3>Nuova fattura</h3>
<input id="fcliente" placeholder="Cliente"><input id="fimp" type="number" placeholder="Importo">
<button class="primary" onclick="addFat()">Emetti</button>
</div>
<div class="card">
<table>
<thead><tr><th>ID</th><th>Cliente</th><th>Totale</th><th></th></tr></thead>
<tbody id="fatTable"></tbody>
</table>
</div>
</div>
</div>
<script>
let rip = JSON.parse(localStorage.getItem("rip")||"[]")let mag = JSON.parse(localStorage.getItem("mag")||"[]")let fat = JSON.parse(localStorage.getItem("fat")||"[]")
function save(){localStorage.setItem("rip",JSON.stringify(rip))localStorage.setItem("mag",JSON.stringify(mag))localStorage.setItem("fat",JSON.stringify(fat))}
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"))
document.getElementById(p).classList.remove("hidden")
render()
}
function render(){
document.getElementById("statRip").innerText=rip.length
let inc=0fat.forEach(f=>inc+=f.imp)
document.getElementById("statMoney").innerText="€"+inc
renderRip()renderMag()renderFat()
}
function addRip(){
rip.push({
id:Date.now(),nome:nome.value,device:device.value,stato:"In attesa"
})
save()render()
}
function renderRip(){
let html=""
rip.forEach(r=>{
html+=`<tr><td>#${r.id}</td><td>${r.nome}</td><td>${r.device}</td><td>${r.stato}</td><td><button onclick="delRip(${r.id})">X</button></td></tr>`
})
ripTable.innerHTML=html
}
function delRip(id){
rip=rip.filter(r=>r.id!=id)save()render()
}
function addMag(){
mag.push({
desc:pdesc.value,qty:parseInt(pqty.value)
})
save()render()
}
function renderMag(){
let html=""
mag.forEach((m,i)=>{
html+=`<tr><td>${m.desc}</td><td>${m.qty}</td><td><button onclick="delMag(${i})">X</button></td></tr>`
})
magTable.innerHTML=html
}
function delMag(i){
mag.splice(i,1)save()render()
}
function addFat(){
fat.push({
id:Date.now(),cliente:fcliente.value,imp:parseFloat(fimp.value)
})
save()render()
}
function renderFat(){
let html=""
fat.forEach(f=>{
html+=`<tr><td>#${f.id}</td><td>${f.cliente}</td><td>€${f.imp}</td><td><button onclick="delFat(${f.id})">X</button></td></tr>`
})
fatTable.innerHTML=html
}
function delFat(id){
fat=fat.filter(f=>f.id!=id)save()render()
}
function backup(){
let data={rip,mag,fat}
let blob=new Blob([JSON.stringify(data)],{type:"application/json"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="repairpro-backup.json"
a.click()
}
render()
</script>
</body></html>
